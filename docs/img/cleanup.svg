<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 245" width="790" height="245" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1f2328">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="790" height="245" rx="8" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600">接断线</text><text x="280" y="26" font-size="14" font-weight="600">过滤</text><text x="540" y="26" font-size="14" font-weight="600">简化（道格拉斯-普克）</text><path d="M30,170L60,140L100,128L128,124" fill="none" stroke="hsl(0,70%,42%)" stroke-width="2.4"/><path d="M136,122L170,112L205,85L230,60" fill="none" stroke="hsl(67,70%,42%)" stroke-width="2.4"/><circle cx="132" cy="123" r="13" fill="none" stroke="#6e7781" stroke-dasharray="3 2"/><text x="132" y="158" text-anchor="middle" font-size="12">端点相距 ≤ 2 像素</text><text x="30" y="205" font-size="12">→ 合成一条链，少一次跳线</text><text x="30" y="225" font-size="11" fill="#6e7781">（也会顺便把首尾相接的链标成闭环）</text><line x1="300" y1="60" x2="500" y2="60" stroke="hsl(0,70%,42%)" stroke-width="2.4"/><line x1="300" y1="90" x2="470" y2="90" stroke="hsl(67,70%,42%)" stroke-width="2.4"/><line x1="300" y1="120" x2="420" y2="120" stroke="hsl(134,70%,42%)" stroke-width="2.4"/><line x1="300" y1="150" x2="330" y2="150" stroke="#6e7781" stroke-width="2.4" stroke-dasharray="2 3"/><line x1="345" y1="150" x2="360" y2="150" stroke="#6e7781" stroke-width="2.4" stroke-dasharray="2 3"/><line x1="380" y1="150" x2="390" y2="150" stroke="#6e7781" stroke-width="2.4" stroke-dasharray="2 3"/><text x="400" y="154" fill="#dc2626" font-size="12">× 太短</text><text x="290" y="185" font-size="12">链长 &lt; 对角线 × 最短比例 → 丢掉</text><text x="290" y="205" font-size="12">再按长度排序，只留最长的 K 条</text><text x="290" y="225" font-size="11" fill="#6e7781">（中档：1%，K = 150）</text><path d="M564.8564293117863,178.74157276121537L672.8564293117863,118.74157276121538L663.1435706882137,101.25842723878462L555.1435706882137,161.25842723878463Z" fill="#fef3c7"/><path d="M560,170L572,170L572,158L572,158L584,158L584,158L596,158L596,146L596,146L608,146L608,146L620,146L620,134L620,134L632,134L632,134L644,134L644,122L644,122L656,122L656,122L668,122L668,110" fill="none" stroke="#6e7781" stroke-width="1.2"/><circle cx="560" cy="170" r="2" fill="#6e7781"/><circle cx="572" cy="170" r="2" fill="#6e7781"/><circle cx="572" cy="158" r="2" fill="#6e7781"/><circle cx="572" cy="158" r="2" fill="#6e7781"/><circle cx="584" cy="158" r="2" fill="#6e7781"/><circle cx="584" cy="158" r="2" fill="#6e7781"/><circle cx="596" cy="158" r="2" fill="#6e7781"/><circle cx="596" cy="146" r="2" fill="#6e7781"/><circle cx="596" cy="146" r="2" fill="#6e7781"/><circle cx="608" cy="146" r="2" fill="#6e7781"/><circle cx="608" cy="146" r="2" fill="#6e7781"/><circle cx="620" cy="146" r="2" fill="#6e7781"/><circle cx="620" cy="134" r="2" fill="#6e7781"/><circle cx="620" cy="134" r="2" fill="#6e7781"/><circle cx="632" cy="134" r="2" fill="#6e7781"/><circle cx="632" cy="134" r="2" fill="#6e7781"/><circle cx="644" cy="134" r="2" fill="#6e7781"/><circle cx="644" cy="122" r="2" fill="#6e7781"/><circle cx="644" cy="122" r="2" fill="#6e7781"/><circle cx="656" cy="122" r="2" fill="#6e7781"/><circle cx="656" cy="122" r="2" fill="#6e7781"/><circle cx="668" cy="122" r="2" fill="#6e7781"/><circle cx="668" cy="110" r="2" fill="#6e7781"/><line x1="560" y1="170" x2="668" y2="110" stroke="#d97706" stroke-width="2.4"/><text x="550" y="205" font-size="12">像素台阶上所有点都在容差带内</text><text x="550" y="225" font-size="12">→ 中间点全删，只留两端（中档容差 1 px）</text>
</svg>
