<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 330" width="790" height="330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1f2328">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="790" height="330" rx="8" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600">① 非极大值抑制：沿梯度方向只留峰值</text><text x="420" y="26" font-size="14" font-weight="600">② 双阈值 + 滞后连接</text><rect x="40" y="207.5" width="36" height="22.5" fill="#e5e7eb" stroke="#d0d7de"/><rect x="90" y="185" width="36" height="45" fill="#e5e7eb" stroke="#d0d7de"/><rect x="140" y="140" width="36" height="90" fill="#e5e7eb" stroke="#d0d7de"/><rect x="190" y="80" width="36" height="150" fill="#2563eb"/><rect x="240" y="125" width="36" height="105" fill="#e5e7eb" stroke="#d0d7de"/><rect x="290" y="177.5" width="36" height="52.5" fill="#e5e7eb" stroke="#d0d7de"/><rect x="340" y="207.5" width="36" height="22.5" fill="#e5e7eb" stroke="#d0d7de"/><text x="208" y="72" text-anchor="middle" fill="#2563eb" font-size="12">比两侧都大 → 保留</text><text x="58" y="199.5" text-anchor="middle" fill="#6e7781" font-size="11">置 0</text><line x1="40" y1="246" x2="376" y2="246" stroke="#1f2328" marker-end="url(#arr)"/><text x="208" y="266" text-anchor="middle" font-size="12" fill="#6e7781">垂直于边缘的一排像素（梯度方向，取 4 个方向之一）</text><text x="208" y="284" text-anchor="middle" font-size="12">结果：粗边缘变成 1 像素宽</text><rect x="430" y="200" width="18" height="30" fill="#e5e7eb"/><rect x="454" y="155" width="18" height="75" fill="#93c5fd"/><rect x="478" y="140" width="18" height="90" fill="#93c5fd"/><rect x="502" y="95" width="18" height="135" fill="#2563eb"/><rect x="526" y="125" width="18" height="105" fill="#93c5fd"/><rect x="550" y="147.5" width="18" height="82.5" fill="#93c5fd"/><rect x="574" y="162.5" width="18" height="67.5" fill="#93c5fd"/><rect x="598" y="207.5" width="18" height="22.5" fill="#e5e7eb"/><rect x="622" y="215" width="18" height="15" fill="#e5e7eb"/><rect x="646" y="155" width="18" height="75" fill="#fecaca"/><rect x="670" y="147.5" width="18" height="82.5" fill="#fecaca"/><rect x="694" y="170" width="18" height="60" fill="#fecaca"/><rect x="718" y="200" width="18" height="30" fill="#e5e7eb"/><rect x="742" y="215" width="18" height="15" fill="#e5e7eb"/><line x1="425" y1="110" x2="770" y2="110" stroke="#1f2328" stroke-dasharray="5 3"/><line x1="425" y1="182" x2="770" y2="182" stroke="#1f2328" stroke-dasharray="2 3"/><text x="430" y="250" font-size="12" fill="#6e7781">沿着边缘走的一串像素</text><rect x="430" y="264" width="12" height="12" fill="#2563eb"/><text x="447" y="275" font-size="12">强：直接算边缘</text><rect x="430" y="284" width="12" height="12" fill="#93c5fd"/><text x="447" y="295" font-size="12">弱，但连着强的 → 保留</text><rect x="430" y="304" width="12" height="12" fill="#fecaca"/><text x="447" y="315" font-size="12">弱且孤立 → 丢掉</text><line x1="600" y1="270" x2="626" y2="270" stroke="#1f2328" stroke-dasharray="5 3"/><text x="632" y="275" font-size="12">高阈值：梯度强度百分位</text><text x="632" y="293" font-size="11" fill="#6e7781">（中档取第 90 百分位）</text><line x1="600" y1="310" x2="626" y2="310" stroke="#1f2328" stroke-dasharray="2 3"/><text x="632" y="315" font-size="12">低阈值 = 0.4 × 高</text>
</svg>
