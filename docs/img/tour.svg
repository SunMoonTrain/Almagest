<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 310" width="790" height="310" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1f2328">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="790" height="310" rx="8" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600">① 贪心：每次去最近的入口</text><text x="280" y="26" font-size="14" font-weight="600">② 2-opt：倒序一段，解开交叉</text><text x="540" y="26" font-size="14" font-weight="600">③ 树形往返（备选）</text><path d="M40,80L120,80" fill="none" stroke="hsl(0,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><circle cx="120" cy="80" r="4" fill="#1f2328"/><text x="108" y="70" font-size="11">出口</text><path d="M160,130L230,70" fill="none" stroke="hsl(67,70%,42%)" stroke-width="2.6"/><circle cx="190" cy="215" r="30" fill="none" stroke="hsl(134,70%,42%)" stroke-width="2.6"/><line x1="120" y1="80" x2="230" y2="70" stroke="#e5e7eb" stroke-width="1.2"/><line x1="120" y1="80" x2="175" y2="189" stroke="#e5e7eb" stroke-width="1.2"/><line x1="120" y1="80" x2="158" y2="128" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><text x="150" y="112" font-size="11" fill="#6e7781" text-anchor="end">最近</text><text x="20" y="272" font-size="12">开放链两端都能当入口（反着走），</text><text x="20" y="290" font-size="12">闭环的任一顶点都能当入口。用网格查最近。</text><text x="280" y="50" font-size="12">之前：A → C → B → D，跳线交叉</text><path d="M310,76L370,76" fill="none" stroke="hsl(0,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="340" y="70" text-anchor="middle" font-size="12" font-weight="600">A</text><line x1="370" y1="76" x2="410" y2="136" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M410,136L470,136" fill="none" stroke="hsl(134,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="440" y="152" text-anchor="middle" font-size="12" font-weight="600">C</text><line x1="470" y1="136" x2="470" y2="76" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M470,76L410,76" fill="none" stroke="hsl(67,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="440" y="70" text-anchor="middle" font-size="12" font-weight="600">B</text><line x1="410" y1="76" x2="370" y2="136" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M370,136L310,136" fill="none" stroke="hsl(201,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="340" y="152" text-anchor="middle" font-size="12" font-weight="600">D</text><line x1="310" y1="136" x2="310" y2="76" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><text x="280" y="172" font-size="12">之后：把 [C, B] 倒序、各自掉头</text><path d="M310,198L370,198" fill="none" stroke="hsl(0,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="340" y="192" text-anchor="middle" font-size="12" font-weight="600">A</text><line x1="370" y1="198" x2="410" y2="198" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M410,198L470,198" fill="none" stroke="hsl(67,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="440" y="192" text-anchor="middle" font-size="12" font-weight="600">B</text><line x1="470" y1="198" x2="470" y2="258" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M470,258L410,258" fill="none" stroke="hsl(134,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="440" y="274" text-anchor="middle" font-size="12" font-weight="600">C</text><line x1="410" y1="258" x2="370" y2="258" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><path d="M370,258L310,258" fill="none" stroke="hsl(201,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><text x="340" y="274" text-anchor="middle" font-size="12" font-weight="600">D</text><line x1="310" y1="258" x2="310" y2="198" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" /><text x="280" y="296" font-size="12">总跳线变短就接受；最多跑 200 ms</text><path d="M560,70L740,70" fill="none" stroke="hsl(0,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><path d="M580,130L580,200" fill="none" stroke="hsl(67,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><path d="M720,120L760,190" fill="none" stroke="hsl(134,70%,42%)" stroke-width="2.6" marker-end="url(#arr)"/><line x1="560" y1="70" x2="580" y2="130" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="740" y1="70" x2="720" y2="120" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="540" y="222" font-size="12">链之间连最小生成树，深度优先走：</text><text x="540" y="239" font-size="12">父链走到头 → 跳到子链 → 子链来回</text><text x="540" y="256" font-size="12">→ 跳回 → 父链反着走回来。</text><text x="540" y="273" font-size="12">每条跳线正反各走一次、自身重合，</text><text x="540" y="290" font-size="12">所以看不出跳线；代价是总长约翻倍。</text>
</svg>
