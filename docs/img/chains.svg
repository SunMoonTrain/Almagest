<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" width="790" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1f2328">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="790" height="400" rx="8" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600">串链：按邻居个数给边缘像素分类，再沿着走</text><line x1="24" y1="44" x2="388" y2="44" stroke="#e5e7eb"/><line x1="24" y1="70" x2="388" y2="70" stroke="#e5e7eb"/><line x1="24" y1="96" x2="388" y2="96" stroke="#e5e7eb"/><line x1="24" y1="122" x2="388" y2="122" stroke="#e5e7eb"/><line x1="24" y1="148" x2="388" y2="148" stroke="#e5e7eb"/><line x1="24" y1="174" x2="388" y2="174" stroke="#e5e7eb"/><line x1="24" y1="200" x2="388" y2="200" stroke="#e5e7eb"/><line x1="24" y1="226" x2="388" y2="226" stroke="#e5e7eb"/><line x1="24" y1="252" x2="388" y2="252" stroke="#e5e7eb"/><line x1="24" y1="278" x2="388" y2="278" stroke="#e5e7eb"/><line x1="24" y1="304" x2="388" y2="304" stroke="#e5e7eb"/><line x1="24" y1="44" x2="24" y2="304" stroke="#e5e7eb"/><line x1="50" y1="44" x2="50" y2="304" stroke="#e5e7eb"/><line x1="76" y1="44" x2="76" y2="304" stroke="#e5e7eb"/><line x1="102" y1="44" x2="102" y2="304" stroke="#e5e7eb"/><line x1="128" y1="44" x2="128" y2="304" stroke="#e5e7eb"/><line x1="154" y1="44" x2="154" y2="304" stroke="#e5e7eb"/><line x1="180" y1="44" x2="180" y2="304" stroke="#e5e7eb"/><line x1="206" y1="44" x2="206" y2="304" stroke="#e5e7eb"/><line x1="232" y1="44" x2="232" y2="304" stroke="#e5e7eb"/><line x1="258" y1="44" x2="258" y2="304" stroke="#e5e7eb"/><line x1="284" y1="44" x2="284" y2="304" stroke="#e5e7eb"/><line x1="310" y1="44" x2="310" y2="304" stroke="#e5e7eb"/><line x1="336" y1="44" x2="336" y2="304" stroke="#e5e7eb"/><line x1="362" y1="44" x2="362" y2="304" stroke="#e5e7eb"/><line x1="388" y1="44" x2="388" y2="304" stroke="#e5e7eb"/><rect x="181" y="279" width="24" height="24" fill="#16a34a"/><rect x="181" y="253" width="24" height="24" fill="#fdba74"/><rect x="181" y="227" width="24" height="24" fill="#fdba74"/><rect x="181" y="201" width="24" height="24" fill="#fdba74"/><rect x="181" y="175" width="24" height="24" fill="#dc2626"/><rect x="155" y="149" width="24" height="24" fill="#fdba74"/><rect x="129" y="123" width="24" height="24" fill="#fdba74"/><rect x="103" y="97" width="24" height="24" fill="#fdba74"/><rect x="77" y="71" width="24" height="24" fill="#fdba74"/><rect x="51" y="45" width="24" height="24" fill="#16a34a"/><rect x="207" y="149" width="24" height="24" fill="#fdba74"/><rect x="233" y="123" width="24" height="24" fill="#dc2626"/><rect x="259" y="97" width="24" height="24" fill="#fdba74"/><rect x="285" y="71" width="24" height="24" fill="#fdba74"/><rect x="311" y="45" width="24" height="24" fill="#16a34a"/><rect x="259" y="149" width="24" height="24" fill="#16a34a"/><path d="M63,57L89,83L115,109L141,135L167,161L193,187" fill="none" stroke="#1f2328" stroke-width="2" /><circle cx="129" cy="99" r="9" fill="#fff" stroke="#1f2328"/><text x="129" y="103" text-anchor="middle" font-size="11" fill="#1f2328">1</text><path d="M323,57L297,83L271,109L245,135" fill="none" stroke="#1f2328" stroke-width="2" /><circle cx="311" cy="73" r="9" fill="#fff" stroke="#1f2328"/><text x="311" y="77" text-anchor="middle" font-size="11" fill="#1f2328">2</text><path d="M271,161L245,135" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/><circle cx="287" cy="169" r="9" fill="#fff" stroke="#dc2626"/><text x="287" y="173" text-anchor="middle" font-size="11" fill="#dc2626">3</text><path d="M193,291L193,265L193,239L193,213L193,187" fill="none" stroke="#1f2328" stroke-width="2" /><circle cx="207" cy="229" r="9" fill="#fff" stroke="#1f2328"/><text x="207" y="233" text-anchor="middle" font-size="11" fill="#1f2328">4</text><path d="M245,135L219,161L193,187" fill="none" stroke="#1f2328" stroke-width="2" /><circle cx="205" cy="175" r="9" fill="#fff" stroke="#1f2328"/><text x="205" y="179" text-anchor="middle" font-size="11" fill="#1f2328">5</text><rect x="410" y="52" width="14" height="14" fill="#16a34a"/><text x="432" y="64">端点：1 个邻居</text><rect x="410" y="76" width="14" height="14" fill="#fdba74"/><text x="432" y="88">普通点：2 个邻居</text><rect x="410" y="100" width="14" height="14" fill="#dc2626"/><text x="432" y="112">交叉点：≥ 3 个邻居</text><text x="410" y="144" font-size="12" font-weight="600">走法（8 邻域）：</text><text x="410" y="163" font-size="12">1. 从每个端点出发，走到端点或交叉点为止 → 链 1–4</text><text x="410" y="182" font-size="12">2. 再从每个交叉点的每个没走过的分支出发 → 链 5</text><text x="410" y="201" font-size="12">3. 还没走过的像素必然成环 → 闭合链</text><text x="410" y="220" font-size="12"></text><text x="410" y="239" font-size="12" font-weight="600">清理：</text><text x="410" y="258" font-size="12">• 链 3 一头连交叉点、一头悬空、长 &lt; 3 像素</text><text x="410" y="277" font-size="12">   → 当毛刺剪掉</text><text x="410" y="296" font-size="12">• 端点相距 ≤ 2 像素的链首尾接上（2 和 5、</text><text x="410" y="315" font-size="12">   1 和 4 都在交叉点相遇，会被接成更长的链）</text><text x="410" y="334" font-size="12"></text><text x="410" y="353" font-size="12">细化后又删掉了台阶拐角像素，所以普通线上</text><text x="410" y="372" font-size="12">每个点恰好 2 个邻居，不会到处是假交叉点。</text>
</svg>
